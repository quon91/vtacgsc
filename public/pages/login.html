<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — VTAC GSC</title>
<link rel="stylesheet" href="/css/main.css">
<style>
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at top, rgba(200,169,81,.06) 0%, transparent 60%), var(--bg); }
.auth-box  { background: var(--card); border: 1px solid var(--border2); border-radius: 18px; padding: 40px; width: 100%; max-width: 420px; }
.auth-logo { text-align: center; margin-bottom: 28px; }
.auth-emblem { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg,var(--gold),var(--amber)); display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 900; color: #000; margin: 0 auto 10px; box-shadow: 0 0 24px rgba(200,169,81,.3); }
.auth-org  { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.auth-name { font-size: 18px; font-weight: 900; color: var(--text); }
.auth-title { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
.auth-sub   { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
.auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
.pw-wrap { position: relative; }
.pw-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 0; }
.reset-inline { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; }
.reset-inline button { background: none; border: none; color: var(--gold); cursor: pointer; font-family: var(--sans); font-size: 12px; text-decoration: underline; padding: 0; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box fade-in">
    <div class="auth-logo">
      <div class="auth-emblem">GSC</div>
      <div class="auth-org">Virtual</div>
      <div class="auth-name">Global Strike Command</div>
    </div>

    <div id="denied-alert" class="alert alert-error" style="display:none">Your account application was denied. Contact command staff for more information.</div>

    <div class="auth-title">Pilot Login</div>
    <div class="auth-sub">Enter your credentials to access the command portal.</div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="pilot@vtacgsc.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw()">👁</button>
        </div>
      </div>
      <div id="login-error" class="alert alert-error" style="display:none"></div>
      <div id="reset-offer" class="alert alert-info" style="display:none;font-size:12px"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" id="login-btn">
        Sign In
      </button>
    </form>

    <div style="text-align:center;margin-top:14px">
      <a href="/pages/forgot-password.html" style="font-size:13px;color:var(--text2)">Forgot password?</a>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/pages/register.html">Apply to Join</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="/js/firebase-config.js"></script>
<script>
// Show denied message if redirected from auth check
if (new URLSearchParams(location.search).get('denied')) {
  document.getElementById('denied-alert').style.display = 'block';
}

// If already logged in, redirect
function onAuthReady(user, pilot) {
  if (!user) return;
  if (pilot?.status === 'active') {
    if (isMasterAdminPilot(pilot)) { window.location.href = '/pages/master-admin.html'; return; }
    window.location.href = '/pages/dashboard.html';
  } else if (pilot?.status === 'pending') {
    window.location.href = '/pages/pending.html';
  }
}

// ── ERROR MESSAGES ───────────────────────────────────────────
// Firebase changed behaviour: with email-enumeration protection on,
// a wrong password AND a non-existent account BOTH return
// auth/invalid-credential. That's deliberate — it stops attackers
// discovering which addresses are registered — but it means the old
// auth/wrong-password and auth/user-not-found codes almost never
// fire any more, and without an entry for the new code members just
// saw raw "Firebase: Error (auth/invalid-credential)." text.
const AUTH_MSGS = {
  'auth/invalid-credential':        'Email or password is incorrect. If you are sure the password is right, there may be no account for that exact address — check for typos, and whether you signed up with a different email.',
  'auth/invalid-login-credentials': 'Email or password is incorrect. If you are sure the password is right, there may be no account for that exact address — check for typos, and whether you signed up with a different email.',
  'auth/wrong-password':            'Incorrect password.',
  'auth/user-not-found':            'No account found with that email.',
  'auth/invalid-email':             'That does not look like a valid email address.',
  'auth/user-disabled':             'This account has been disabled. Contact command staff.',
  'auth/too-many-requests':         'Too many failed attempts. Wait a few minutes and try again, or reset your password.',
  'auth/network-request-failed':    'Could not reach the server. Check your connection and try again.',
};
// Codes where offering a password reset is the useful next step.
const RESET_WORTHY = ['auth/invalid-credential','auth/invalid-login-credentials','auth/wrong-password','auth/too-many-requests'];

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const btn   = document.getElementById('login-btn');
  const errEl = document.getElementById('login-error');
  const offer = document.getElementById('reset-offer');
  errEl.style.display = 'none';
  offer.style.display = 'none';
  btn.textContent = 'Signing in…'; btn.disabled = true;

  try {
    const cred = await auth.signInWithEmailAndPassword(email, pass);

    // ── PAST THIS POINT THE PASSWORD WAS CORRECT ──────────────
    // Everything below is post-login housekeeping. It must never be
    // able to throw the user back to this page with what looks like
    // a credential error — that's what used to happen when the
    // lastLogin write failed, and it is indistinguishable from a
    // wrong password to the member reporting it.
    let pilot = null;
    try {
      const doc = await db.collection('pilots').doc(cred.user.uid).get();
      pilot = doc.exists ? doc.data() : null;
    } catch(readErr) {
      console.error('pilot doc read failed:', readErr);
      errEl.textContent = 'Signed in, but your pilot record could not be loaded ('
        + readErr.message + '). Contact command staff.';
      errEl.style.display = 'block';
      return;
    }

    if (!pilot) {
      // Authenticated but no pilot document — half-finished registration.
      errEl.textContent = 'Your login works, but there is no pilot record attached to it. '
        + 'Command staff need to finish setting up your account.';
      errEl.style.display = 'block';
      return;
    }

    if (pilot.status === 'denied') {
      await auth.signOut();
      errEl.textContent = 'Your application was denied. Contact command staff.';
      errEl.style.display = 'block';
      return;
    }
    if (pilot.status === 'pending') { window.location.href = '/pages/pending.html'; return; }

    // Fire-and-forget. A failure here is not worth blocking a valid
    // login over, so it is logged and ignored rather than thrown.
    db.collection('pilots').doc(cred.user.uid)
      .update({ lastLogin: firebase.firestore.FieldValue.serverTimestamp() })
      .catch(function(err){ console.warn('lastLogin not recorded:', err.message); });

    if (isMasterAdminPilot(pilot)) { window.location.href = '/pages/master-admin.html'; return; }
    window.location.href = '/pages/dashboard.html';

  } catch(err) {
    console.error('login failed:', err.code, err.message);
    errEl.textContent = AUTH_MSGS[err.code] || err.message;
    errEl.style.display = 'block';
    // Offer a reset right here rather than sending them hunting for a link.
    if (RESET_WORTHY.indexOf(err.code) !== -1 && email) {
      offer.innerHTML = 'Sure the password is right? '
        + '<button type="button" onclick="sendReset()">Email me a reset link</button>';
      offer.style.display = 'block';
    }
  } finally {
    btn.textContent = 'Sign In'; btn.disabled = false;
  }
}

// Sends a Firebase reset email. Deliberately reports success even when
// the address has no account — saying "no account with that email"
// would let anyone test which addresses are registered.
async function sendReset() {
  const email = document.getElementById('email').value.trim();
  const offer = document.getElementById('reset-offer');
  if (!email) { offer.textContent = 'Enter your email address above first.'; return; }
  offer.textContent = 'Sending…';
  try {
    await auth.sendPasswordResetEmail(email);
  } catch(err) {
    console.warn('reset email:', err.code, err.message);
    if (err.code === 'auth/invalid-email') {
      offer.textContent = 'That does not look like a valid email address.';
      return;
    }
    if (err.code === 'auth/too-many-requests') {
      offer.textContent = 'Too many requests. Wait a few minutes before trying again.';
      return;
    }
  }
  offer.textContent = 'If an account exists for ' + email
    + ', a reset link is on its way. Check spam if it does not arrive in a few minutes.';
}

function togglePw() {
  const inp = document.getElementById('password');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
